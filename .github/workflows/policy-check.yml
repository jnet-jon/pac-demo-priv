name: Policy as Code

on:
  pull_request:
    paths:
      - "terraform/**"
      - "policy/**"

permissions:
  contents: read

jobs:
  conftest:
    name: Org policy (OPA / Conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz \
            | tar -xz conftest
          sudo mv conftest /usr/local/bin/
      - name: Evaluate Terraform against org policy
        run: conftest test --parser hcl2 --policy policy/ terraform/

  checkov:
    name: Baseline checks (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          # Keep the demo output focused on the network story
          check: CKV_AWS_24,CKV_AWS_25,CKV_AWS_260,CKV_AWS_277
          quiet: true
          skip_download: true
